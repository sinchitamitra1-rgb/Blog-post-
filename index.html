<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reflections a journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   EDITING YOUR BLOG â€” read this first
   All of your posts live in content/posts.json and content/about.json,
   which you edit through the CMS at yoursite.com/admin
   ============================================================ */

:root{
  --paper: #FBF3E4;
  --paper-shadow: #E9DCBE;
  --paper-deep: #F2E6C9;
  --ink: #23304C;
  --ink-soft: #4B5773;
  --spine: #141E33;
  --spine-light: #22304E;
  --gold: #E3A13B;
  --gold-deep: #C67F1F;
  --teal: #2E7A6E;
  --plum: #6E4172;
  --coral: #D6573F;
  --cream-hi: #FFFBF1;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Literata', serif;
  color:var(--ink);
  background:var(--spine);
  overflow-x:hidden;
  min-height:100vh;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

h1,h2,h3,.display{
  font-family:'Fraunces', serif;
  font-weight:600;
  letter-spacing:-0.01em;
}

.hidden{display:none !important;}

/* ---------- ANIMATED SCENE STYLES ---------- */

.ambient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  transition: background 1.5s ease;
}

/* Sunrise Light Effect */
.ambient.sun-risen {
  background: linear-gradient(180deg, #1e293b 0%, #334155 35%, #d97706 75%, #f59e0b 100%) !important;
}

.rising-sun {
  position: absolute;
  bottom: -150px;
  left: 50%;
  transform: translateX(-50%);
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, #fef08a 25%, #fde047 55%, rgba(251, 191, 36, 0) 75%);
  border-radius: 50%;
  opacity: 0;
  transition: transform 2.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.8s ease;
  filter: blur(8px);
}

.ambient.sun-risen .rising-sun {
  transform: translate(-50%, -240px);
  opacity: 0.9;
}

/* ---------- BOTTOM HILLS & CARTOON CHARACTERS ---------- */
.natural-grass-scene{position:fixed;bottom:0;left:0;width:100vw;height:210px;z-index:2;pointer-events:none;overflow:hidden}
.hill{position:absolute;bottom:-78px;border-radius:50% 50% 0 0}.hill-back{width:76%;height:168px;left:-8%;background:#3d8b66}.hill-middle{width:72%;height:142px;right:-13%;background:#4fa979}.hill-front{width:118%;height:116px;left:-9%;background:#67b875}
.cartoon-girl{position:absolute;bottom:44px;filter:drop-shadow(0 5px 5px rgba(20,45,38,.2))}.cartoon-girl svg{display:block;width:100%;height:auto}.balloon-girl{left:7%;width:145px;z-index:4}.girl-reading-wrapper{right:7%;width:180px;z-index:4}
.balloon-button{position:absolute;left:21%;bottom:128px;width:59px;height:78px;padding:0;z-index:5;cursor:pointer;border:0;background:transparent;pointer-events:auto;touch-action:manipulation;filter:drop-shadow(0 3px 3px rgba(20,45,38,.18))}
.balloon-button:focus-visible{outline:3px solid #fff8d8;outline-offset:5px;border-radius:50%}.balloon{display:block;width:59px;height:78px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 34% 28%,#ffe9e1 0 7%,#f08a83 8% 22%,#d95761 56%,#b93f57 100%);position:relative;transition:transform .2s ease}.balloon::before{content:'';position:absolute;width:10px;height:8px;bottom:-5px;left:25px;background:#b93f57;clip-path:polygon(0 0,100% 0,50% 100%)}.balloon::after{content:'';position:absolute;width:1.5px;height:70px;background:#73485b;top:75px;left:29px;transform-origin:top}.balloon-button:hover .balloon{transform:translateY(-4px) rotate(-3deg)}.balloon-button.flying{animation:balloonFly 3.6s cubic-bezier(.18,.72,.35,1) forwards;pointer-events:none}
@keyframes balloonFly{0%{transform:translate(0,0) rotate(0);opacity:1}25%{transform:translate(26px,-105px) rotate(7deg)}55%{transform:translate(-18px,-270px) rotate(-8deg)}100%{transform:translate(80px,-650px) rotate(12deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.balloon-button.flying{animation:balloonFade .2s ease forwards}@keyframes balloonFade{to{opacity:0}}}

/* Birds Flying */
.flock {
  position: fixed;
  top: 10%; left: -15%;
  z-index: 1; pointer-events: none;
  animation: flyAcross 22s linear infinite;
}

.bird {
  position: absolute;
  width: 16px; height: 9px;
  background: #fef08a;
  clip-path: polygon(0 0, 50% 100%, 100% 0, 50% 35%);
  animation: wingFlap 0.6s ease-in-out infinite alternate;
}
.bird-1 { top: 0; left: 0; }
.bird-2 { top: 15px; left: 25px; animation-delay: 0.15s; }
.bird-3 { top: -10px; left: 45px; animation-delay: 0.3s; }

@keyframes flyAcross {
  0% { left: -15%; top: 14%; }
  100% { left: 115%; top: 18%; }
}
@keyframes wingFlap {
  0% { transform: scaleY(1); }
  100% { transform: scaleY(-0.5); }
}

/* Comments Section Styling */
.comments-container {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px dashed rgba(35,48,76,0.2);
}
.comments-title {
  font-family: 'Fraunces', serif;
  font-size: 1.1rem;
  color: var(--ink);
  margin-bottom: 8px;
}

/* Ambient Background Blobs */
.ambient span{
  position:absolute; border-radius:50%; filter:blur(60px); opacity:0.35;
  animation:drift 22s ease-in-out infinite;
}
.ambient span:nth-child(1){width:420px; height:420px; background:var(--teal); top:-120px; left:-100px; animation-delay:0s;}
.ambient span:nth-child(2){width:360px; height:360px; background:var(--gold); bottom:-140px; right:-80px; animation-delay:4s;}
.ambient span:nth-child(3){width:300px; height:300px; background:var(--plum); top:40%; left:60%; animation-delay:8s;}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(30px,-40px) scale(1.08);}
}

/* ============================================================
   COVER
   ============================================================ */
#cover{
  position:relative; z-index:1;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:32px;
}
.book-cover{
  position:relative;
  width:min(560px, 90vw);
  aspect-ratio:3/4;
  background:linear-gradient(160deg, var(--spine-light), var(--spine) 60%);
  border-radius:6px 10px 10px 6px;
  box-shadow:
    0 30px 70px -20px rgba(0,0,0,0.7),
    inset -10px 0 30px rgba(0,0,0,0.5),
    inset 0 0 0 2px rgba(227,161,59,0.15);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px;
  text-align:center;
  padding:40px;
  transition:transform 0.9s cubic-bezier(.6,.1,.2,1), opacity 0.7s ease;
}
.book-cover::before{
  content:''; position:absolute; left:22px; top:0; bottom:0; width:2px;
  background:linear-gradient(180deg, transparent, rgba(227,161,59,0.4), transparent);
}
.book-cover::after{
  content:''; position:absolute; right:-6px; top:10px; bottom:10px; width:10px;
  background:repeating-linear-gradient(180deg, var(--paper), var(--paper) 2px, var(--paper-shadow) 3px, var(--paper) 4px);
  border-radius:0 4px 4px 0;
  box-shadow:2px 0 6px rgba(0,0,0,0.3);
}
.cover-ornament{
  width:64px; height:64px;
  border:2px solid var(--gold);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--gold);
  font-family:'Caveat', cursive;
  font-size:1.6rem;
}
.cover-title{
  font-size:clamp(2.6rem, 8vw, 4.2rem);
  color:var(--cream-hi);
  line-height:1;
}
.cover-title em{
  color:var(--gold);
  font-style:italic;
  font-weight:500;
}
.cover-sub{
  font-family:'Caveat', cursive;
  font-size:1.5rem;
  color:#C9B98A;
  max-width:340px;
}
.open-btn{
  margin-top:10px;
  font-family:'Fraunces', serif;
  font-size:1rem;
  letter-spacing:0.03em;
  background:var(--gold);
  color:var(--spine);
  border:none;
  padding:14px 30px;
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
  box-shadow:0 8px 20px -6px rgba(227,161,59,0.6);
  transition:transform 0.25s ease, box-shadow 0.25s ease;
}
.open-btn:hover, .open-btn:focus-visible{
  transform:translateY(-2px);
  box-shadow:0 12px 26px -6px rgba(227,161,59,0.8);
}
.open-btn:focus-visible{outline:3px solid var(--cream-hi); outline-offset:3px;}
.edit-link{
  position:absolute; bottom:22px; right:26px;
  font-family:'Literata', serif; font-size:0.78rem;
  color:#8a7c56; text-decoration:none;
  opacity:0.7;
}
.edit-link:hover, .edit-link:focus-visible{opacity:1; text-decoration:underline;}

.wax-seal{
  position:absolute; bottom:-18px; right:36px;
  width:52px; height:52px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #E2694A, var(--coral) 65%);
  box-shadow:0 6px 14px rgba(0,0,0,0.4);
  display:flex; align-items:center; justify-content:center;
  color:#fff2ea; font-family:'Fraunces', serif; font-weight:700; font-size:1rem;
  transform:rotate(-8deg);
}

#cover.opening .book-cover{
  transform:scale(1.15) rotateY(-8deg);
  opacity:0;
}
#cover.gone{display:none;}

/* ============================================================
   BOOK SPREAD (table of contents)
   ============================================================ */
#book{
  position:relative; z-index:1;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:26px;
  opacity:0;
  animation:fadeUp 0.8s ease forwards;
  animation-delay:0.15s;
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(18px);}
  to{opacity:1; transform:translateY(0);}
}
.spread{
  position:relative;
  width:min(1080px, 96vw);
  min-height:640px;
  background:var(--spine);
  border-radius:10px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,0.85);
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:14px;
  gap:6px;
}
.spread::before{
  content:''; position:absolute; left:50%; top:14px; bottom:14px; width:44px;
  transform:translateX(-50%);
  background:linear-gradient(90deg, transparent, rgba(0,0,0,0.35), transparent);
  z-index:5; pointer-events:none;
}
.page{
  background:var(--paper);
  border-radius:4px;
  padding:44px 42px;
  position:relative;
  box-shadow:inset 0 0 40px rgba(0,0,0,0.05);
  overflow:hidden;
}
.page.left{border-radius:4px 2px 2px 4px;}
.page.right{border-radius:2px 4px 4px 2px;}
.page::before{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle at 8% 12%, rgba(0,0,0,0.03) 0, transparent 3px),
    radial-gradient(circle at 92% 85%, rgba(0,0,0,0.03) 0, transparent 3px);
  pointer-events:none;
}

.eyebrow{
  font-family:'Caveat', cursive;
  color:var(--gold-deep);
  font-size:1.3rem;
  margin-bottom:2px;
}
.page-heading{
  font-size:1.9rem;
  color:var(--ink);
  margin-bottom:14px;
  line-height:1.15;
}
.about-copy{
  font-size:1.02rem;
  color:var(--ink-soft);
  line-height:1.7;
  max-width:38ch;
}
.about-copy + .about-copy{margin-top:14px;}

.doodle-map{
  position:absolute; bottom:26px; left:42px; right:42px;
  opacity:0.55;
}

.stamp{
  position:absolute; top:38px; right:38px;
  width:74px; height:74px;
  border:2px dashed var(--teal);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  transform:rotate(8deg);
  color:var(--teal);
  font-family:'Caveat', cursive;
  font-size:1rem;
  text-align:center;
  line-height:1.1;
}

.toc-list{
  list-style:none;
  display:flex; flex-direction:column;
  gap:4px;
  margin-top:6px;
}
.toc-entry{
  position:relative;
  display:flex; align-items:baseline; gap:16px;
  padding:14px 46px 14px 4px;
  border-bottom:1px solid rgba(35,48,76,0.12);
  cursor:pointer;
  background:none; border-left:none; border-right:none; border-top:none;
  text-align:left;
  width:100%;
  font-family:inherit;
  transition:padding-left 0.2s ease, background 0.2s ease;
}
.toc-entry:hover, .toc-entry:focus-visible{
  padding-left:10px;
  background:rgba(227,161,59,0.08);
}
.toc-entry:focus-visible{outline:2px solid var(--gold-deep); outline-offset:-2px;}
.toc-page-num{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-weight:500;
  color:var(--gold-deep);
  font-size:0.95rem;
  min-width:52px;
}
.toc-meta{flex:1; min-width:0;}
.toc-title{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:1.12rem;
  color:var(--ink);
  margin-bottom:3px;
}
.toc-excerpt{
  font-size:0.88rem;
  color:var(--ink-soft);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.toc-date{
  font-family:'Caveat', cursive;
  font-size:1.1rem;
  color:#8a7c56;
  white-space:nowrap;
}
.tab{
  position:absolute; right:-2px; top:50%; transform:translateY(-50%);
  width:34px; height:26px;
  border-radius:3px 6px 6px 3px;
  box-shadow:1px 2px 5px rgba(0,0,0,0.25);
}
.tab.travel{background:var(--teal);}
.tab.nostalgia{background:var(--plum);}
.tab.rant{background:var(--coral);}

.legend{
  display:flex; gap:18px; margin-top:24px; flex-wrap:wrap;
}
.legend-item{
  display:flex; align-items:center; gap:7px;
  font-size:0.82rem; color:var(--ink-soft);
  font-family:'Literata', serif;
}
.legend-dot{width:11px; height:11px; border-radius:3px;}
.legend-dot.travel{background:var(--teal);}
.legend-dot.nostalgia{background:var(--plum);}
.legend-dot.rant{background:var(--coral);}

.close-book-btn{
  position:absolute; top:-46px; left:50%; transform:translateX(-50%);
  background:none; border:1px solid rgba(255,255,255,0.25);
  color:#d9cfae; font-family:'Literata', serif; font-size:0.85rem;
  padding:8px 18px; border-radius:999px; cursor:pointer;
  transition:background 0.2s ease;
}
.close-book-btn:hover, .close-book-btn:focus-visible{background:rgba(255,255,255,0.08);}

/* ============================================================
   READER (single post, page-turn effect)
   ============================================================ */
#reader{
  position:relative; z-index:1;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:26px;
  perspective:2400px;
}
.reader-page{
  width:min(760px, 96vw);
  min-height:640px;
  background:var(--paper);
  border-radius:6px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,0.85);
  padding:56px 60px;
  position:relative;
  transform-origin:left center;
  animation:pageTurnIn 0.6s cubic-bezier(.5,0,.2,1) both;
}
@keyframes pageTurnIn{
  from{transform:rotateY(-95deg); opacity:0.3;}
  to{transform:rotateY(0deg); opacity:1;}
}
.reader-page.leaving{
  animation:pageTurnOut 0.45s cubic-bezier(.5,0,.2,1) both;
}
@keyframes pageTurnOut{
  from{transform:rotateY(0deg); opacity:1;}
  to{transform:rotateY(-95deg); opacity:0;}
}
.reader-tab{
  position:absolute; right:-2px; top:64px;
  width:38px; height:30px;
  border-radius:3px 6px 6px 3px;
  box-shadow:1px 2px 5px rgba(0,0,0,0.25);
}
.reader-back{
  background:none; border:none; cursor:pointer;
  font-family:'Fraunces', serif; font-size:0.9rem;
  color:var(--ink-soft);
  display:flex; align-items:center; gap:6px;
  margin-bottom:26px;
  padding:6px 4px;
}
.reader-back:hover, .reader-back:focus-visible{color:var(--ink);}
.reader-page-num{
  font-family:'Fraunces', serif; font-style:italic; color:var(--gold-deep);
  font-size:0.95rem; margin-bottom:8px;
}
.reader-title{
  font-size:clamp(1.8rem, 4vw, 2.5rem);
  color:var(--ink);
  line-height:1.12;
  margin-bottom:10px;
}
.reader-date{
  font-family:'Caveat', cursive;
  font-size:1.3rem;
  color:#8a7c56;
  margin-bottom:26px;
}
.reader-body p{
  font-size:1.08rem;
  line-height:1.85;
  color:var(--ink);
  margin-bottom:18px;
  max-width:60ch;
}
.reader-body p:first-of-type::first-letter{
  font-family:'Fraunces', serif;
  font-size:3.4rem;
  font-weight:600;
  float:left;
  line-height:0.85;
  padding-right:8px;
  padding-top:4px;
  color:var(--gold-deep);
}
.reader-doodle{
  margin:8px 0 22px 0;
  opacity:0.9;
}
.reader-photo{
  width:100%; max-height:340px; object-fit:cover;
  border-radius:4px; margin-bottom:24px;
  box-shadow:0 10px 24px -10px rgba(0,0,0,0.35);
}
.load-state{
  color:var(--cream-hi); font-family:'Caveat', cursive; font-size:1.4rem;
  text-align:center; padding-top:120px;
}
.reader-nav{
  display:flex; justify-content:space-between; margin-top:36px;
  padding-top:20px; border-top:1px solid rgba(35,48,76,0.12);
}
.reader-nav button{
  background:none; border:none; cursor:pointer;
  font-family:'Literata', serif; font-size:0.92rem;
  color:var(--ink-soft);
  display:flex; align-items:center; gap:6px;
}
.reader-nav button:hover, .reader-nav button:focus-visible{color:var(--ink);}
.reader-nav button:disabled{opacity:0.3; cursor:default;}
.reader-nav button:disabled:hover{color:var(--ink-soft);}

/* ---------- responsive & mobile view fix ---------- */
@media (max-width:760px){
  .spread{
    grid-template-columns:1fr !important;
    min-height:auto !important;
    gap:16px !important;
    padding:10px !important;
  }
  .spread::before{display:none !important;}

  /* Force BOTH left (main blog content) AND right (comments) pages to display */
  .page.left, .page.right {
    display:block !important;
    width:100% !important;
    border-radius:6px !important;
    padding:28px 20px !important;
  }

  .reader-page{padding:38px 26px;}
  .stamp{display:none;}

  .reader-nav {
    position: relative !important;
    bottom: auto !important;
    left: auto !important;
    right: auto !important;
    margin-top: 24px !important;
  }

  .natural-grass-scene {
    height: 110px !important;
  }

  .girl-reading-wrapper {
    right: 2% !important;
    bottom: 6px !important;
  }

  .girl-img {
    width: 95px !important;
  }
}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<!-- ---------- Animated Background Scene ---------- -->
<div class="ambient" id="ambientBg">
  <!-- Sun Rising Element -->
  <div class="rising-sun" id="risingSun"></div>

  <!-- Birds Flying -->
  <div class="flock">
    <div class="bird bird-1"></div>
    <div class="bird bird-2"></div>
    <div class="bird bird-3"></div>
  </div>

  <!-- Bottom-only cartoon hills and characters -->
  <div class="natural-grass-scene" aria-label="A cartoon scene of two girls on grassy hills">
    <div class="hill hill-back"></div><div class="hill hill-middle"></div><div class="hill hill-front"></div>
    <div class="cartoon-girl balloon-girl" aria-hidden="true"><svg viewBox="0 0 145 160" xmlns="http://www.w3.org/2000/svg"><path d="M41 155c8-35 7-65 2-88 11-14 42-13 54 3-6 25-4 54 6 85H41z" fill="#f4b7a8"/><path d="M52 80c4 15 3 46-4 72M86 83c-2 17 1 45 10 69" fill="none" stroke="#e7a28f" stroke-width="7" stroke-linecap="round"/><path d="M42 89c-14 15-21 34-24 48M95 91c14 12 21 28 24 44" fill="none" stroke="#f3bdab" stroke-width="9" stroke-linecap="round"/><circle cx="70" cy="48" r="25" fill="#f7c6b1"/><path d="M47 48c-1-25 13-38 29-35 20 3 24 20 18 38-5-11-12-16-22-16-10 0-18 5-25 13z" fill="#543d43"/><circle cx="61" cy="50" r="2.5" fill="#23304c"/><circle cx="80" cy="50" r="2.5" fill="#23304c"/><path d="M65 62q6 5 12 0" fill="none" stroke="#b95a61" stroke-width="2.5" stroke-linecap="round"/><path d="M43 95q28 12 56 0l-4-28q-25 10-49 0z" fill="#e56e74"/><path d="M41 155h20M87 155h20" stroke="#433947" stroke-width="9" stroke-linecap="round"/></svg></div>
    <button class="balloon-button" id="balloonButton" type="button" aria-label="Send the balloon flying"><span class="balloon" aria-hidden="true"></span></button>
    <div class="cartoon-girl girl-reading-wrapper" aria-hidden="true"><svg viewBox="0 0 180 145" xmlns="http://www.w3.org/2000/svg"><path d="M14 126c37-12 58-34 88-28 33 6 49 24 64 42H14z" fill="#e8a58f"/><path d="M37 132c21-6 30-34 33-55 5-29 27-35 43-23 12 9 7 30-9 40-13 8-24 23-27 40H37z" fill="#7a548a"/><path d="M53 86c-8 13-20 27-35 31M109 92c11 12 26 21 42 22" fill="none" stroke="#f5c3ad" stroke-width="10" stroke-linecap="round"/><circle cx="94" cy="58" r="23" fill="#f7c7b0"/><path d="M71 61c-2-25 15-39 34-35 17 3 24 19 15 39-8-12-16-16-27-14-8 1-15 5-22 10z" fill="#483942"/><circle cx="86" cy="60" r="2.3" fill="#23304c"/><circle cx="103" cy="60" r="2.3" fill="#23304c"/><path d="M89 70q5 4 10 0" fill="none" stroke="#b95a61" stroke-width="2.5" stroke-linecap="round"/><path d="M56 90l43 9-12 27-42-10z" fill="#f8e8ae" stroke="#c98f50" stroke-width="2"/><path d="M77 94l-4 27" stroke="#c98f50" stroke-width="1.5"/><path d="M28 131h27M118 137h27" stroke="#4d3944" stroke-width="10" stroke-linecap="round"/></svg></div>
  </div>
</div>

<!-- ============ COVER ============ -->
<section id="cover">
  <div class="book-cover">
    <div class="cover-ornament">¦</div>
    <h1 class="cover-title">Reflections<br><em>a journal</em></h1>
    <p class="cover-sub">A door into my mind</p>
    <button class="open-btn" id="openBookBtn">Open the book</button>
    <div class="wax-seal">S</div>
  </div>
  <a href="/admin/" class="edit-link">write a new entry</a>
</section>

<!-- ============ BOOK / TABLE OF CONTENTS ============ -->
<section id="book" class="hidden">
  <div style="position:relative;">
    <button class="close-book-btn" id="closeBookBtn">close the book</button>
    <div class="spread">
      <div class="page left">
        <p class="eyebrow">From the author</p>
        <h2 class="page-heading" id="aboutHeading">Hi, I'm keeping this journal.</h2>
        <p class="about-copy" id="aboutPara1"></p>
        <p class="about-copy" id="aboutPara2"></p>
        <div class="stamp">est.<br>2026</div>
        <svg class="doodle-map" viewBox="0 0 300 60" width="100%" height="60" aria-hidden="true">
          <path d="M10 40 Q 60 10, 100 35 T 190 25 T 290 45" fill="none" stroke="#C9B98A" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round"/>
          <circle cx="10" cy="40" r="4" fill="#2E7A6E"/>
          <circle cx="150" cy="28" r="4" fill="#D6573F"/>
          <circle cx="290" cy="45" r="4" fill="#6E4172"/>
        </svg>
      </div>
      <div class="page right">
        <p class="eyebrow">Table of contents</p>
        <h2 class="page-heading">Entries</h2>
        <ul class="toc-list" id="tocList"></ul>

      </div>
    </div>
  </div>
</section>

<!-- ============ READER ============ -->
<section id="reader" class="hidden"></section>

<script>
let POSTS = [];

function slugify(title){
  return title.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

async function loadContent(){
  try{
    const [aboutRes, postsRes] = await Promise.all([
      fetch('content/about.json', { cache: 'no-store' }),
      fetch('content/posts.json', { cache: 'no-store' })
    ]);
    const about = await aboutRes.json();
    const postsData = await postsRes.json();

    document.getElementById('aboutHeading').textContent = about.heading || '';
    document.getElementById('aboutPara1').textContent = about.paragraph1 || '';
    document.getElementById('aboutPara2').textContent = about.paragraph2 || '';

    POSTS = (postsData.posts || []).map(p => ({ ...p, id: slugify(p.title) }));
    renderTOC();
  }catch(err){
    document.getElementById('tocList').innerHTML =
      '<li class="load-state" style="color:var(--ink-soft);">Couldn\'t load entries right now. Try refreshing.</li>';
  }
}

let currentIndex = 0;

function renderTOC(){
  const list = document.getElementById('tocList');
  list.innerHTML = '';
  POSTS.forEach((post, i) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <button class="toc-entry" data-index="${i}" aria-label="Read ${post.title}">
        <span class="toc-page-num">Pg. ${post.pageNum}</span>
        <span class="toc-meta">
          <span class="toc-title">${post.title}</span>
          <span class="toc-excerpt">${post.excerpt}</span>
        </span>
        <span class="toc-date">${post.date}</span>

      </button>`;
    list.appendChild(li);
  });
  list.querySelectorAll('.toc-entry').forEach(btn => {
    btn.addEventListener('click', () => openPost(parseInt(btn.dataset.index)));
  });
}

function openPost(index){
  currentIndex = index;
  const post = POSTS[index];
  const reader = document.getElementById('reader');
  const paragraphs = post.content ? post.content.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => `<p>${p}</p>`).join('') : '';
  const photo = post.image ? `<img class="reader-photo" src="${post.image}" alt="">` : '';
  const postId = post.id || index;
  const postTitle = (post.title || '').replace(/"/g, '&quot;');

  reader.innerHTML = `
    <div style="position:relative; width:100%; display:flex; flex-direction:column; align-items:center;">
      <button class="close-book-btn" id="readerBack" style="margin-bottom:15px; position:relative; top:0; left:0; transform:none;"> back to table of contents</button>
      
      <div class="spread">
        <!-- Left Page: Chapter Story -->
        <div class="page left">
          <p class="eyebrow">Chapter ${index + 1}</p>
          <h2 class="reader-title">${post.title}</h2>
          <p class="reader-date">${post.date}</p>
          ${photo}
          <div class="reader-body">${paragraphs}</div>
        </div>

        <!-- Right Page: Continuation & Comments -->
        <div class="page right">
          <div class="comments-container">
            <h3 class="comments-title">Reflections & Thoughts</h3>
            <p style="font-size:0.88rem; color:var(--ink-soft); margin-bottom:12px;">Leave a thought on Chapter ${index + 1}:</p>
            
            <!-- Comment Section Widget -->
            <div id="cusdis_thread"
              data-host="https://cusdis.com"
              data-app-id="f1238cce-d24d-477c-9411-e5c37bf8fe15"
              data-page-id="${postId}"
              data-page-url="https://dog-eared.netlify.app/#post-${postId}"
              data-page-title="${postTitle}"
            ></div>
          </div>

          <div class="reader-nav" style="position:absolute; bottom:30px; left:42px; right:42px;">
            <button id="prevPost" ${index === 0 ? 'disabled' : ''}>previous chapter</button>
            <button id="nextPost" ${index === POSTS.length - 1 ? 'disabled' : ''}>next chapter</button>
          </div>
        </div>
      </div>
    </div>`;

  document.getElementById('book').classList.add('hidden');
  reader.classList.remove('hidden');
  
  // Re-initialize Cusdis widget dynamically for the newly loaded post
  if (window.CUSDIS) {
    window.CUSDIS.initial();
  } else {
    const existingScript = document.getElementById('cusdis-script');
    if (existingScript) existingScript.remove();
    const script = document.createElement('script');
    script.id = 'cusdis-script';
    script.async = true;
    script.defer = true;
    script.src = 'https://cusdis.com/js/cusdis.es.js';
    document.body.appendChild(script);
  }

  document.getElementById('readerBack').addEventListener('click', closeReader);
  const prevBtn = document.getElementById('prevPost');
  const nextBtn = document.getElementById('nextPost');
  if(prevBtn) prevBtn.addEventListener('click', () => openPost(index - 1));
  if(nextBtn) nextBtn.addEventListener('click', () => openPost(index + 1));
  
  reader.scrollIntoView({ behavior:'smooth', block:'start' });
}

function closeReader(){
  document.getElementById('reader').classList.add('hidden');
  document.getElementById('reader').innerHTML = '';
  document.getElementById('book').classList.remove('hidden');
}

document.getElementById('openBookBtn').addEventListener('click', () => {
  const cover = document.getElementById('cover');
  cover.classList.add('opening');
  document.getElementById('ambientBg').appendChild(balloonGirl);
  
  // Trigger Sunrise background transition
  document.getElementById('ambientBg').classList.add('sun-risen');

  setTimeout(() => {
    cover.classList.add('gone');
    document.getElementById('book').classList.remove('hidden');
  }, 550);
});

document.getElementById('closeBookBtn').addEventListener('click', () => {
  document.getElementById('book').classList.add('hidden');
  document.getElementById('cover').classList.remove('opening','gone');
  scene.appendChild(balloonGirl);
  
  // Reset Sunrise background when book closes
  document.getElementById('ambientBg').classList.remove('sun-risen');
  
  document.getElementById('cover').scrollIntoView({behavior:'instant'});
});

document.getElementById('balloonButton').addEventListener('click', event => { const balloon = event.currentTarget; if (!balloon.classList.contains('flying')) { balloon.classList.add('flying'); balloon.setAttribute('aria-label', 'The balloon is flying away'); } });

// Keep the bottom illustration above the book; the sun and birds stay behind it.
document.body.appendChild(document.querySelector('.natural-grass-scene'));

// Use text characters safely even if the editor saves this file with a different encoding.
document.querySelector('.cover-ornament')?.remove();
document.getElementById('closeBookBtn').textContent = '← close the book';
document.getElementById('reader').addEventListener('DOMNodeInserted', () => {
  const back = document.getElementById('readerBack');
  const previous = document.getElementById('prevPost');
  const next = document.getElementById('nextPost');
  if (back) back.textContent = '← back to table of contents';
  if (previous) previous.textContent = '← previous chapter';
  if (next) next.textContent = 'next chapter →';
});

// Place the supplied reading girl on the front-most hill.
document.querySelector('.balloon-girl')?.remove();
document.getElementById('balloonButton')?.remove();
const scene = document.querySelector('.natural-grass-scene');
const readingGirl = document.querySelector('.girl-reading-wrapper');
readingGirl.innerHTML = '<img src="girl-reading-cutout.png" alt="Cartoon girl reading a book">';
readingGirl.setAttribute('role', 'button');
readingGirl.setAttribute('tabindex', '0');
readingGirl.setAttribute('aria-label', 'Show a happy reading message');
const readingHill = document.createElement('div');
readingHill.className = 'reading-girl-hill';
const readingCloud = document.createElement('div');
readingCloud.className = 'reading-cloud';
readingCloud.textContent = 'Happy Reading';
scene.append(readingHill, readingCloud);
let readingMessageTimer;
function showReadingMessage() {
  readingCloud.classList.add('visible');
  clearTimeout(readingMessageTimer);
  readingMessageTimer = setTimeout(() => readingCloud.classList.remove('visible'), 5000);
}
readingGirl.addEventListener('click', showReadingMessage);
readingGirl.addEventListener('keydown', event => {
  if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showReadingMessage(); }
});

// Reuse the same art for a smaller, partially hill-hidden balloon girl in the distance.
const balloonGirl = document.createElement('div');
balloonGirl.className = 'balloon-girl-reference';
balloonGirl.innerHTML = '<img src="balloon-girl-cutout.png" alt="">';
const flyingBalloon = document.createElement('button');
flyingBalloon.className = 'balloon-button';
flyingBalloon.type = 'button';
flyingBalloon.setAttribute('aria-label', 'Send the balloon flying');
flyingBalloon.innerHTML = '<img src="balloon-only.png" alt="">';
scene.append(balloonGirl, flyingBalloon);
flyingBalloon.addEventListener('click', () => {
  if (!flyingBalloon.classList.contains('flying')) flyingBalloon.classList.add('flying');
});

const sceneStyle = document.createElement('style');
sceneStyle.textContent = `
  .natural-grass-scene { height:175px !important; z-index:9999 !important; overflow:visible !important; }
  .hill { bottom:-76px; } .hill-back { height:132px; z-index:1; } .hill-middle { height:106px; left:24%; right:auto; width:54%; } .hill-front { height:88px; bottom:-66px; }
  .balloon-girl-reference { position:absolute; left:7%; bottom:20px; z-index:2; width:118px; }
  .hill-middle { z-index:3; } .hill-front { z-index:6; }
  .reading-girl-hill { position:absolute; right:-11%; bottom:-158px; width:min(720px, 58vw); height:360px; background:#5aa96e; z-index:2; border-radius:0; clip-path:polygon(0 100%,0 56%,5% 51%,10% 47%,16% 43%,23% 39%,30% 37%,37% 38%,44% 41%,51% 43%,58% 40%,65% 35%,72% 31%,79% 30%,86% 34%,93% 40%,100% 46%,100% 100%); pointer-events:none; }
  .girl-reading-wrapper { z-index:12; width:min(245px, 33vw) !important; right:8% !important; bottom:-46px !important; pointer-events:auto; cursor:pointer; }
  .girl-reading-wrapper img, .balloon-girl-reference img { display:block; width:100%; height:auto; }
  .girl-reading-wrapper:focus-visible { outline:3px solid #fff7c7; outline-offset:5px; border-radius:18px; }
  .reading-cloud { position:absolute; right:10%; bottom:120px; z-index:9; padding:10px 15px; border-radius:22px; background:#fffdf1; color:#5a4664; font-family:'Caveat', cursive; font-size:1.25rem; box-shadow:0 5px 12px rgba(0,0,0,.18); opacity:0; transform:translateY(10px) scale(.85); transition:opacity .25s ease, transform .25s ease; pointer-events:none; white-space:nowrap; }
  .reading-cloud::after { content:''; position:absolute; right:25px; bottom:-10px; border:11px solid transparent; border-top-color:#fffdf1; border-bottom:0; }
  .reading-cloud.visible { opacity:1; transform:translateY(0) scale(1); }
  .balloon-button { left:calc(7% + 30px); bottom:127px; width:58px; height:72px; z-index:8; outline:none !important; border:0 !important; padding:0 !important; background:transparent !important; }
  .balloon-button img { display:block; width:100%; height:100%; object-fit:contain; border:0; background:transparent; }
  @media (max-width:760px) {
    .girl-reading-wrapper { width:min(95px, 25vw) !important; right:0 !important; bottom:-7px !important; }
    .reading-girl-hill { width:164px; height:75px; right:-8%; bottom:-33px; }
    .reading-cloud { right:8%; bottom:78px; font-size:1rem; padding:8px 11px; }
    .balloon-girl-reference { width:62px; left:3%; bottom:5px; }
    .balloon-button { left:calc(3% + 15px); bottom:65px; width:38px; height:48px; transform:none; }
  }
`;
document.head.appendChild(sceneStyle);

loadContent();

if (window.netlifyIdentity) {
  window.netlifyIdentity.on('init', user => {
    if (!user) {
      window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; });
    }
  });
}
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>
</html>
