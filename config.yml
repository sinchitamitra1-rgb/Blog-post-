backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog posts"
    files:
      - file: "content/posts.json"
        label: "All entries"
        name: "posts"
        fields:
          - label: "Entries"
            name: "posts"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Date shown on the page", name: "date", widget: "string", hint: "e.g. March 2026"}
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["travel", "nostalgia", "rant"]
              - label: "Page number"
                name: "pageNum"
                widget: "number"
                hint: "The number shown as 'Page —'. Pick anything, they don't need to be in order."
              - {label: "Short preview line", name: "excerpt", widget: "string"}
              - label: "Photo (optional)"
                name: "image"
                widget: "image"
                required: false
              - label: "Paragraphs"
                name: "content"
                widget: "list"
                hint: "Add one item per paragraph."
  - name: "about"
    label: "About page"
    files:
      - file: "content/about.json"
        label: "About text"
        name: "about"
        fields:
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "First paragraph", name: "paragraph1", widget: "text"}
          - {label: "Second paragraph", name: "paragraph2", widget: "text"}
